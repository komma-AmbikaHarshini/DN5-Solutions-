<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Invite</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        #videoStatus {
            margin-top: 10px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>
<body>

<h1>Nature Video</h1>

<video id="promoVideo" width="400" controls oncanplay="videoReady()">
    <source src="Images/11971072_2160_3840_30fps.mp4" type="video/mp4">
    Your browser does not support the video tag.
</video>

<div id="videoStatus"></div>

<script>
    function videoReady() {
        document.getElementById("videoStatus").textContent = "Video ready to play";
    }

    window.onbeforeunload = function () {
        return "You have unfinished work. Are you sure you want to leave?";
    };
</script>

</body>
</html>
