<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Event Gallery</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
        }

        h1{
            color: navy;
        }

        table{
            margin: auto;
            border-collapse: collapse;
        }

        caption{
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        td{
            padding: 15px;
        }

        .eventImage{
            width: 180px;
            height: 120px;
            border: 3px solid black;
            border-radius: 10px;
        }

        p{
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Community Event Gallery</h1>

    <table>
        <caption>Past Community Events</caption>

        <tr>
            <td>
                <img src="Images/Event1.jpeg"
                     alt="Event 1"
                     title="Event 1"
                     class="eventImage">
                <p>Butterfly</p>
            </td>

            <td>
                <img src="Images/Event2.jpeg"
                     alt="Event 2"
                     title="Event 2"
                     class="eventImage">
                <p>Nature</p>
            </td>

            <td>
                <img src="Images/Event3.jpeg"
                     alt="Event 3"
                     title="Event 3"
                     class="eventImage">
                <p>Tiger</p>
            </td>
        </tr>

        <tr>
            <td>
                <img src="Images/Event4.jpeg"
                     alt="Event 4"
                     title="Event 4"
                     class="eventImage">
                <p>Strawberry</p>
            </td>

            <td>
                <img src="Images/Event5.jpeg"
                     alt="Event 5"
                     title="Event 5"
                     class="eventImage">
                <p>Sun Rise</p>
            </td>

            <td>
                <img src="Images/Event6.jpeg"
                     alt="Event 6"
                     title="Event 6"
                     class="eventImage">
                <p>Mountains</p>
            </td>
        </tr>

    </table>

</body>
</html>
