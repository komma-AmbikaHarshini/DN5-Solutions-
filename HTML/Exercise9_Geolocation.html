<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        button {
            padding: 10px 14px;
            cursor: pointer;
        }

        #geoResult {
            margin-top: 12px;
            font-weight: bold;
            color: blue;
        }
    </style>
</head>
<body>

<h1>Find Nearby Events</h1>

<button onclick="findLocation()">Find Nearby Events</button>
<div id="geoResult"></div>

<script>
    function findLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(showPosition, showError, {
                enableHighAccuracy: true,
                timeout: 5000,
                maximumAge: 0
            });
        } else {
            document.getElementById("geoResult").textContent = "Geolocation is not supported by this browser.";
        }
    }

    function showPosition(position) {
        let lat = position.coords.latitude;
        let lon = position.coords.longitude;

        document.getElementById("geoResult").textContent =
            "Latitude: " + lat + ", Longitude: " + lon;
    }

    function showError(error) {
        let message = "";

        switch (error.code) {
            case error.PERMISSION_DENIED:
                message = "User denied the request for Geolocation.";
                break;
            case error.POSITION_UNAVAILABLE:
                message = "Location information is unavailable.";
                break;
            case error.TIMEOUT:
                message = "The request to get user location timed out.";
                break;
            default:
                message = "An unknown error occurred.";
        }

        document.getElementById("geoResult").textContent = message;
    }
</script>

</body>
</html>
