<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Selectors Playground</title>

<style>

/* Universal Selector */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* Body */
body{
    font-family:Arial;
    padding:20px;
}

/* Element Selector */
h2{
    color:blue;
}

/* ID Selector */
#mainHeader{
    background-color:lightblue;
    padding:15px;
    margin-bottom:20px;
}

/* Class Selector */
.eventCard{
    border:2px solid black;
    padding:15px;
    margin-bottom:10px;
}

/* Group Selector */
h3,p{
    color:green;
}

</style>

</head>
<body>

<div id="mainHeader">
    <h1>Community Event Portal</h1>
</div>

<div class="eventCard">
    <h2>Music Festival</h2>
    <h3>Live Performance</h3>
    <p>Enjoy music with friends.</p>
</div>

<div class="eventCard">
    <h2>Food Festival</h2>
    <h3>Local Dishes</h3>
    <p>Taste delicious food.</p>
</div>

</body>
</html>
