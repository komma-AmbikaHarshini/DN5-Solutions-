<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Exercise 10 — Responsive & Media Queries</title>
    <style>
        body{font-family:Arial;padding:18px;background:#f8fafc}
        .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
        .card{background:#fff;padding:12px;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,0.05)}
        img.responsive{width:100%;height:auto;border-radius:6px;display:block}

        @media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
        @media (max-width:600px){.grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
    <h1>Exercise 10 — Responsive & Media Queries</h1>
    <p>Grid adapts to smaller screens; images scale fluidly.</p>
    <div class="grid">
        <div class="card"><img class="responsive" src="https://images.unsplash.com/photo-1505673520738-c6a539b2b3d5?w=800&q=60" alt="Sample"><h3>Event 1</h3></div>
        <div class="card"><img class="responsive" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800&q=60" alt="Sample"><h3>Event 2</h3></div>
        <div class="card"><img class="responsive" src="https://images.unsplash.com/photo-1496307042754-b4aa456c4a2d?w=800&q=60" alt="Sample"><h3>Event 3</h3></div>
    </div>
</body>
</html>
