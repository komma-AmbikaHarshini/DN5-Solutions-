<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 5</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            padding: 20px;
            line-height: 1.7;
        }

        h1 {
            font-size: 40px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .lead {
            font-size: 20px;
            font-style: italic;
        }

        .description {
            text-align: justify;
            letter-spacing: 0.5px;
        }

        .muted {
            color: #666;
            font-weight: 300;
        }
    </style>
</head>
<body>
    <h1>Community Portal</h1>
    <p class="lead">This is a stylish heading using typography.</p>
    <p class="description">Text formatting makes content easy to read and professional.</p>
    <p class="muted">This line is muted and lighter.</p>
</body>
</html>
