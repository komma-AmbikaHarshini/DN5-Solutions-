<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 4</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            color: #222;
            background-color: #dbeafe;
            background-image: url("https://images.unsplash.com/photo-1523580494863-6f3031224c94?auto=format&fit=crop&w=1200&q=60");
            background-size: cover;
            background-attachment: fixed;
            margin: 0;
        }

        .overlay {
            background: rgba(255, 255, 255, 0.85);
            min-height: 100vh;
            padding: 20px;
        }

        header {
            background: linear-gradient(90deg, #1d4ed8, #60a5fa);
            color: white;
            padding: 20px;
            border-radius: 10px;
        }

        .eventCard {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            margin-top: 15px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <header>
            <h1>City Council Events</h1>
            <p>Theme: Colors and Backgrounds</p>
        </header>

        <div class="eventCard">
            <h2>Community Cleanup</h2>
            <p>Green and clean surroundings for everyone.</p>
        </div>
    </div>
</body>
</html>
